# nehir hotkeys mirrored from ~/dotfiles/niri/.config/niri/binds.kdl
# Modifier mapping: niri Mod(Alt)->Option, Super->Command, Ctrl->Control, Shift->Shift.
# Actions with no niri binding are left Unassigned so muscle memory matches across
# Linux (niri) and macOS (nehir). Unmapped niri actions are noted in the summary.

